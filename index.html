<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Neon Wave Boat Rush</title>

<!-- GAME ICON -->
<link rel="icon" type="image/png" href="icon.png">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #020817;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

canvas {
    display: block;

    width: 100%;
    height: 100%;
}

/* =====================================================
   HUD
===================================================== */

#hud {
    position: fixed;

    top: 15px;
    left: 15px;
    right: 15px;

    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}

.hud-left,
.hud-right {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.hud-box {
    min-width: 105px;

    padding: 9px 13px;

    border:
        1px solid
        rgba(0, 238, 255, 0.35);

    border-radius: 13px;

    background:
        rgba(2, 10, 30, 0.72);

    box-shadow:
        0 0 18px
        rgba(0, 220, 255, 0.12),

        inset 0 0 15px
        rgba(0, 220, 255, 0.04);

    backdrop-filter: blur(8px);

    color: white;
}

.hud-label {
    font-size: 9px;

    color: #7beeff;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.hud-value {
    margin-top: 2px;

    font-size: 20px;

    font-weight: 800;

    text-shadow:
        0 0 10px
        rgba(0, 238, 255, 0.8);
}

#boostBox {
    display: none;
}

#speedBar {
    width: 105px;
    height: 5px;

    margin-top: 6px;

    overflow: hidden;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.1);
}

#speedFill {
    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #00eaff,
            #7a5cff,
            #ff3cf2
        );

    box-shadow:
        0 0 10px #00eaff;
}

/* =====================================================
   OVERLAYS
===================================================== */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 30;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0, 238, 255, 0.10),
            transparent 35%
        ),

        rgba(1, 5, 18, 0.72);

    backdrop-filter: blur(8px);
}

.card {
    width: min(560px, 94vw);

    padding: 38px 30px;

    border:
        1px solid
        rgba(0, 238, 255, 0.35);

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(7, 20, 52, 0.94),
            rgba(3, 8, 27, 0.94)
        );

    box-shadow:
        0 0 70px
        rgba(0, 200, 255, 0.12),

        inset 0 0 40px
        rgba(0, 200, 255, 0.025);

    text-align: center;

    color: white;
}

.logo {
    font-size:
        clamp(32px, 7vw, 58px);

    font-weight: 1000;

    font-style: italic;

    letter-spacing: -2px;

    line-height: 0.95;

    color: white;

    text-shadow:
        0 0 8px #00eaff,

        0 0 25px
        rgba(0, 234, 255, 0.8),

        0 0 45px
        rgba(255, 0, 221, 0.35);
}

.logo span {
    color: #00eaff;
}

.subtitle {
    margin-top: 12px;

    color: #89a8c9;

    font-size: 13px;

    letter-spacing: 3px;

    text-transform: uppercase;
}

.instructions {
    margin: 28px auto;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    max-width: 410px;
}

.instruction {
    padding: 12px;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.045);

    border:
        1px solid
        rgba(255,255,255,0.07);

    color: #ccecff;

    font-size: 13px;
}

.key {
    display: inline-block;

    min-width: 25px;

    padding: 3px 7px;

    margin-right: 5px;

    border-radius: 6px;

    background:
        rgba(0, 234, 255, 0.13);

    border:
        1px solid
        rgba(0, 234, 255, 0.3);

    color: #00eaff;

    font-weight: bold;
}

button {
    border: 0;

    cursor: pointer;

    color: white;

    font-weight: 900;

    letter-spacing: 2px;
}

.start-btn {
    width: 100%;

    max-width: 330px;

    padding: 16px;

    border-radius: 14px;

    font-size: 16px;

    background:
        linear-gradient(
            90deg,
            #00bfff,
            #755cff,
            #ed3cff
        );

    box-shadow:
        0 0 25px
        rgba(0, 200, 255, 0.25),

        inset 0 0 15px
        rgba(255,255,255,0.1);

    transition:
        transform 0.15s,
        filter 0.15s;
}

.start-btn:hover {
    transform: translateY(-2px);

    filter: brightness(1.15);
}

.small-note {
    margin-top: 17px;

    color: #607b9d;

    font-size: 11px;
}

/* =====================================================
   GAME OVER
===================================================== */

#gameOver {
    display: none;
}

.final-score {
    margin: 20px 0;

    font-size: 38px;

    font-weight: 1000;

    color: #00eaff;

    text-shadow:
        0 0 20px
        rgba(0,234,255,0.7);
}

/* =====================================================
   MOBILE CONTROLS
===================================================== */

#mobileControls {
    position: fixed;

    left: 0;
    right: 0;

    bottom: 20px;

    z-index: 50;

    display: none;

    justify-content: space-between;

    align-items: flex-end;

    padding:
        0 20px;

    pointer-events: none;
}

.mobile-left {
    display: flex;

    gap: 12px;

    pointer-events: auto;
}

.mobile-btn,
.turbo-btn {
    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

    border:
        2px solid
        rgba(0, 238, 255, 0.45);

    background:
        linear-gradient(
            145deg,
            rgba(15, 45, 85, 0.9),
            rgba(2, 10, 30, 0.9)
        );

    color: #8ff8ff;

    box-shadow:
        0 0 20px
        rgba(0, 238, 255, 0.2),

        inset 0 0 15px
        rgba(0, 238, 255, 0.08);

    backdrop-filter: blur(8px);

    user-select: none;

    display: flex;

    align-items: center;

    justify-content: center;
}

.mobile-btn {
    width: 72px;
    height: 72px;

    border-radius: 20px;

    font-size: 27px;

    font-weight: 900;
}

.turbo-btn {
    pointer-events: auto;

    width: 82px;
    height: 82px;

    border-radius: 50%;

    border-color:
        rgba(255, 60, 230, 0.6);

    color: #ff8af4;

    font-size: 25px;

    line-height: 16px;

    flex-direction: column;

    box-shadow:
        0 0 25px
        rgba(255, 50, 230, 0.25),

        inset 0 0 20px
        rgba(255, 50, 230, 0.08);
}

.turbo-btn span {
    font-size: 9px;

    letter-spacing: 1.5px;

    font-weight: 900;
}

.mobile-btn:active {
    transform: scale(0.9);

    background:
        linear-gradient(
            145deg,
            rgba(0, 220, 255, 0.35),
            rgba(2, 15, 40, 0.95)
        );

    box-shadow:
        0 0 30px
        rgba(0, 238, 255, 0.6);
}

.turbo-btn:active {
    transform: scale(0.9);

    box-shadow:
        0 0 35px
        rgba(255, 50, 230, 0.7);
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

    #mobileControls {
        display: flex;
    }

}

@media (max-width: 650px) {

    #hud {
        top: 8px;

        left: 8px;

        right: 8px;
    }

    .hud-box {
        min-width: 88px;

        padding:
            7px 9px;
    }

    .hud-value {
        font-size: 16px;
    }

    .hud-label {
        font-size: 8px;
    }

    .instructions {
        grid-template-columns: 1fr;

        gap: 7px;

        margin: 20px auto;
    }

    .card {
        padding:
            28px 20px;
    }

}

@media (max-width: 420px) {

    #mobileControls {
        bottom: 12px;

        padding:
            0 12px;
    }

    .mobile-btn {
        width: 62px;

        height: 62px;

        border-radius: 17px;

        font-size: 23px;
    }

    .turbo-btn {
        width: 70px;

        height: 70px;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     GAME CANVAS
===================================================== -->

<canvas id="game"></canvas>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div class="hud-left">

        <div class="hud-box">

            <div class="hud-label">
                Coins
            </div>

            <div class="hud-value"
                 id="coins">
                0
            </div>

        </div>


        <div class="hud-box">

            <div class="hud-label">
                Score
            </div>

            <div class="hud-value"
                 id="score">
                0
            </div>

        </div>

    </div>


    <div class="hud-right">

        <div class="hud-box">

            <div class="hud-label">
                Speed
            </div>

            <div class="hud-value"
                 id="speed">
                0
            </div>

            <div id="speedBar">

                <div id="speedFill"></div>

            </div>

        </div>


        <div class="hud-box"
             id="boostBox">

            <div class="hud-label">
                Turbo
            </div>

            <div class="hud-value">
                READY
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div class="overlay"
     id="startScreen">

    <div class="card">

        <div class="logo">

            NEON

            <br>

            <span>WAVE</span>

        </div>


        <div class="subtitle">
            Boat Rush
        </div>


        <div class="instructions">

            <div class="instruction">
                <span class="key">A</span>
                <span class="key">D</span>
                Steer
            </div>

            <div class="instruction">
                <span class="key">W</span>
                Speed Up
            </div>

            <div class="instruction">
                <span class="key">S</span>
                Slow Down
            </div>

            <div class="instruction">
                <span class="key">SPACE</span>
                Turbo
            </div>

        </div>


        <div class="small-note">

            On mobile, use the
            buttons to steer.

            <br>

            Your boat automatically
            moves forward.

        </div>

        <br>


        <button class="start-btn"
                id="startBtn">

            START RUSH

        </button>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div class="overlay"
     id="gameOver">

    <div class="card">

        <div class="logo"
             style="font-size:42px;">

            RUN

            <br>

            <span>OVER</span>

        </div>


        <div class="final-score"
             id="finalScore">

            0

        </div>


        <div class="subtitle">
            Final Score
        </div>

        <br>


        <button class="start-btn"
                id="restartBtn">

            RACE AGAIN

        </button>

    </div>

</div>


<!-- =====================================================
     MOBILE CONTROLS
===================================================== -->

<div id="mobileControls">

    <div class="mobile-left">

        <button class="mobile-btn"
                id="leftBtn">

            ◀

        </button>


        <button class="mobile-btn"
                id="rightBtn">

            ▶

        </button>

    </div>


    <button class="turbo-btn"
            id="turboBtn">

        ⚡

        <span>
            TURBO
        </span>

    </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );


function resize() {

    W = window.innerWidth;

    H = window.innerHeight;

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let gameTime = 0;

let lastTime = 0;

let score = 0;

let coins = 0;

let speed = 6;

let baseSpeed = 6;

let maxSpeed = 13;

let turbo = false;

let turboCooldown = 0;

let spawnTimer = 0;

let coinTimer = 0;

let shake = 0;


const keys = {

    left: false,

    right: false,

    up: false,

    down: false,

    turbo: false

};


const boat = {

    x: 0,

    y: 0,

    width: 72,

    height: 110,

    tilt: 0

};


let obstacles = [];

let coinObjects = [];

let particles = [];

let waves = [];

let stars = [];


/* =====================================================
   BACKGROUND
===================================================== */

function createBackground() {

    waves = [];

    stars = [];


    for (let i = 0; i < 18; i++) {

        waves.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            width:
                80 +
                Math.random() * 180,

            speed:
                0.4 +
                Math.random() * 1.5,

            alpha:
                0.08 +
                Math.random() * 0.13,

            phase:
                Math.random() *
                Math.PI * 2

        });

    }


    for (let i = 0; i < 70; i++) {

        stars.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            size:
                Math.random() * 1.7,

            alpha:
                0.2 +
                Math.random() * 0.7

        });

    }

}


createBackground();


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

window.addEventListener(
    "keydown",
    e => {

        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowUp",
                "ArrowDown",
                " "
            ].includes(e.key)
        ) {

            e.preventDefault();

        }


        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = true;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = true;

        }


        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ) {

            keys.up = true;

        }


        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ) {

            keys.down = true;

        }


        if (e.key === " ") {

            keys.turbo = true;

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = false;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = false;

        }


        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ) {

            keys.up = false;

        }


        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ) {

            keys.down = false;

        }


        if (e.key === " ") {

            keys.turbo = false;

        }

    }
);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

function holdButton(
    element,
    property
) {

    const start = e => {

        e.preventDefault();

        keys[property] = true;

    };


    const end = e => {

        e.preventDefault();

        keys[property] = false;

    };


    element.addEventListener(
        "pointerdown",
        start
    );

    element.addEventListener(
        "pointerup",
        end
    );

    element.addEventListener(
        "pointercancel",
        end
    );

    element.addEventListener(
        "pointerleave",
        end
    );

}


holdButton(
    document.getElementById("leftBtn"),
    "left"
);


holdButton(
    document.getElementById("rightBtn"),
    "right"
);


holdButton(
    document.getElementById("turboBtn"),
    "turbo"
);


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    score = 0;

    coins = 0;

    speed = 6;

    baseSpeed = 6;

    gameTime = 0;

    spawnTimer = 0;

    coinTimer = 0;

    turbo = false;

    turboCooldown = 0;

    obstacles = [];

    coinObjects = [];

    particles = [];


    boat.x =
        W / 2;

    boat.y =
        H * 0.73;

    boat.tilt = 0;


    running = true;


    document
        .getElementById("startScreen")
        .style.display = "none";


    document
        .getElementById("gameOver")
        .style.display = "none";


    lastTime =
        performance.now();

}


document
    .getElementById("startBtn")
    .onclick =
    startGame;


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    running = false;


    document
        .getElementById("finalScore")
        .textContent =
        Math.floor(score)
        .toLocaleString();


    document
        .getElementById("gameOver")
        .style.display =
        "flex";


    createExplosion(
        boat.x,
        boat.y,
        45
    );

}


document
    .getElementById("restartBtn")
    .onclick =
    startGame;


/* =====================================================
   SPAWN OBSTACLE
===================================================== */

function spawnObstacle() {

    const size =
        25 +
        Math.random() * 23;


    obstacles.push({

        x:
            35 +
            Math.random() *
            (W - 70),

        y: -70,

        size,

        rotation:
            Math.random() *
            Math.PI,

        rotationSpeed:
            (Math.random() - 0.5)
            * 0.03,

        type:
            Math.random() < 0.55
            ? "rock"
            : "mine"

    });

}


/* =====================================================
   SPAWN COIN
===================================================== */

function spawnCoin() {

    coinObjects.push({

        x:
            35 +
            Math.random() *
            (W - 70),

        y: -40,

        radius: 11,

        rotation:
            Math.random() *
            Math.PI * 2,

        pulse:
            Math.random() *
            Math.PI * 2

    });

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticle(
    x,
    y,
    options = {}
) {

    particles.push({

        x,

        y,

        vx:
            options.vx ??
            (Math.random() - 0.5) * 3,

        vy:
            options.vy ??
            (Math.random() - 0.5) * 3,

        life:
            options.life ??
            1,

        maxLife:
            options.life ??
            1,

        size:
            options.size ??
            (2 + Math.random() * 4),

        type:
            options.type ??
            "spark"

    });

}


function createExplosion(
    x,
    y,
    amount = 25
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        createParticle(
            x,
            y,
            {

                vx:
                    (Math.random() - 0.5)
                    * 12,

                vy:
                    (Math.random() - 0.5)
                    * 12,

                life:
                    0.4 +
                    Math.random() * 0.8,

                size:
                    2 +
                    Math.random() * 5,

                type:
                    "explosion"

            }
        );

    }

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt) {

    gameTime += dt;


    /* SPEED */

    if (keys.up) {

        speed +=
            5 * dt;

    }

    else if (keys.down) {

        speed -=
            5 * dt;

    }

    else {

        speed +=
            (baseSpeed - speed)
            * dt
            * 1.5;

    }


    speed =
        Math.max(
            3,
            Math.min(
                maxSpeed,
                speed
            )
        );


    /* TURBO */

    if (
        keys.turbo &&
        turboCooldown <= 0
    ) {

        turbo = true;

    }


    if (turbo) {

        speed +=
            11 * dt;


        if (
            Math.random() <
            0.9
        ) {

            createParticle(

                boat.x +
                (Math.random() - 0.5)
                * 16,

                boat.y + 47,

                {

                    vx:
                        (Math.random() - 0.5)
                        * 2,

                    vy:
                        5 +
                        Math.random() * 6,

                    life:
                        0.25 +
                        Math.random() * 0.3,

                    size:
                        3 +
                        Math.random() * 4,

                    type:
                        "turbo"

                }

            );

        }


        if (
            speed >=
            maxSpeed + 7
        ) {

            speed =
                maxSpeed + 7;

        }

    }


    if (
        !keys.turbo &&
        turbo
    ) {

        turbo = false;

        turboCooldown =
            0.3;

    }


    if (
        turboCooldown > 0
    ) {

        turboCooldown -= dt;

    }


    /* =================================================
       BOAT STEERING
    ================================================= */

    const steeringPower =
        420;


    if (keys.left) {

        boat.x -=
            steeringPower * dt;

        boat.tilt =
            -0.23;

    }

    else if (keys.right) {

        boat.x +=
            steeringPower * dt;

        boat.tilt =
            0.23;

    }

    else {

        boat.tilt *=
            0.9;

    }


    /* Automatic forward movement */

    boat.y =
        H * 0.73 +
        Math.sin(
            gameTime * 3.2
        ) * 3;


    /* Screen boundaries */

    const margin = 42;


    if (
        boat.x <
        margin
    ) {

        boat.x =
            margin;

    }


    if (
        boat.x >
        W - margin
    ) {

        boat.x =
            W - margin;

    }


    /* =================================================
       SPAWN
    ================================================= */

    spawnTimer -= dt;

    coinTimer -= dt;


    const obstacleInterval =
        Math.max(
            0.42,
            0.95 -
            speed * 0.025
        );


    if (
        spawnTimer <= 0
    ) {

        spawnObstacle();

        spawnTimer =
            obstacleInterval;

    }


    if (
        coinTimer <= 0
    ) {

        if (
            Math.random() <
            0.75
        ) {

            spawnCoin();

        }


        coinTimer =
            0.55 +
            Math.random() * 0.55;

    }


    /* =================================================
       MOVE WORLD
    ================================================= */

    const worldSpeed =
        speed * 48;


    for (
        const obstacle
        of obstacles
    ) {

        obstacle.y +=
            worldSpeed * dt;

        obstacle.rotation +=
            obstacle.rotationSpeed;

    }


    for (
        const coin
        of coinObjects
    ) {

        coin.y +=
            worldSpeed * dt;

        coin.rotation +=
            dt * 5;

        coin.pulse +=
            dt * 5;

    }


    /* =================================================
       OBSTACLE COLLISIONS
    ================================================= */

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const o =
            obstacles[i];


        const dx =
            o.x -
            boat.x;

        const dy =
            o.y -
            boat.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance <
            o.size + 28
        ) {

            createExplosion(
                boat.x,
                boat.y,
                40
            );

            shake = 16;

            endGame();

            return;

        }


        if (
            o.y >
            H + 100
        ) {

            obstacles.splice(
                i,
                1
            );

            score += 12;

        }

    }


    /* =================================================
       COIN COLLISIONS
    ================================================= */

    for (
        let i =
            coinObjects.length - 1;

        i >= 0;

        i--
    ) {

        const c =
            coinObjects[i];


        const dx =
            c.x -
            boat.x;

        const dy =
            c.y -
            boat.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance <
            c.radius + 31
        ) {

            coins++;

            score += 100;


            for (
                let p = 0;
                p < 12;
                p++
            ) {

                createParticle(
                    c.x,
                    c.y,
                    {

                        vx:
                            (Math.random() - 0.5)
                            * 7,

                        vy:
                            (Math.random() - 0.5)
                            * 7,

                        life:
                            0.4 +
                            Math.random() * 0.4,

                        size:
                            2 +
                            Math.random() * 3,

                        type:
                            "coin"

                    }
                );

            }


            coinObjects.splice(
                i,
                1
            );

            continue;

        }


        if (
            c.y >
            H + 60
        ) {

            coinObjects.splice(
                i,
                1
            );

        }

    }


    /* Score */

    score +=
        speed *
        dt *
        2;


    /* =================================================
       PARTICLES
    ================================================= */

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx *
            60 *
            dt;

        p.y +=
            p.vy *
            60 *
            dt;


        p.life -= dt;


        if (
            p.type ===
            "turbo"
        ) {

            p.vy +=
                2 * dt;

        }


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }


    /* Water wake */

    if (
        Math.random() <
        0.85
    ) {

        createParticle(

            boat.x +
            (Math.random() - 0.5)
            * 28,

            boat.y + 38,

            {

                vx:
                    (Math.random() - 0.5)
                    * 1.4,

                vy:
                    2 +
                    Math.random() * 2,

                life:
                    0.45 +
                    Math.random() * 0.3,

                size:
                    2 +
                    Math.random() * 3,

                type:
                    "wake"

            }

        );

    }


    shake *=
        0.88;


    /* HUD */

    document.getElementById(
        "coins"
    ).textContent =
        coins;


    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score)
        .toLocaleString();


    document.getElementById(
        "speed"
    ).textContent =
        Math.floor(
            speed * 10
        );


    const speedPercent =
        Math.min(
            100,
            (speed /
            (maxSpeed + 7))
            * 100
        );


    document.getElementById(
        "speedFill"
    ).style.width =
        speedPercent + "%";


    document.getElementById(
        "boostBox"
    ).style.display =
        turbo
        ? "block"
        : "none";

}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#02081e"
    );

    gradient.addColorStop(
        0.45,
        "#03154a"
    );

    gradient.addColorStop(
        1,
        "#001e3a"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Horizon glow */

    const horizon =
        H * 0.36;


    const glow =
        ctx.createRadialGradient(
            W / 2,
            horizon,
            0,
            W / 2,
            horizon,
            W * 0.65
        );


    glow.addColorStop(
        0,
        "rgba(0,234,255,0.13)"
    );

    glow.addColorStop(
        0.5,
        "rgba(0,120,255,0.04)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Stars */

    for (
        const s
        of stars
    ) {

        const pulse =
            0.5 +
            Math.sin(
                gameTime * 2 +
                s.x
            ) * 0.5;


        ctx.globalAlpha =
            s.alpha *
            pulse;


        ctx.fillStyle =
            "#a9f7ff";


        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.globalAlpha = 1;


    /* Moving waves */

    for (
        const wave
        of waves
    ) {

        wave.y +=
            (
                wave.speed +
                speed * 0.35
            ) *
            60 *
            0.016;


        if (
            wave.y >
            H + 40
        ) {

            wave.y =
                -30;

            wave.x =
                Math.random() * W;

        }


        ctx.beginPath();


        for (
            let x = -50;
            x < W + 60;
            x += 18
        ) {

            const y =
                wave.y +
                Math.sin(
                    x * 0.025 +
                    gameTime * 1.5 +
                    wave.phase
                ) * 4;


            if (
                x === -50
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }


        ctx.strokeStyle =
            `rgba(0,220,255,${wave.alpha})`;

        ctx.lineWidth =
            1.3;

        ctx.stroke();

    }


    /* Perspective streaks */

    ctx.globalAlpha =
        0.14;


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        const y =
            (
                (
                    i * 90 +
                    gameTime *
                    speed *
                    35
                ) %
                (H + 160)
            ) - 80;


        const width =
            50 +
            (y / H) *
            250;


        ctx.beginPath();

        ctx.moveTo(
            W / 2 - width,
            y
        );

        ctx.lineTo(
            W / 2 + width,
            y
        );


        ctx.strokeStyle =
            "#007eff";

        ctx.lineWidth = 1;

        ctx.stroke();

    }


    ctx.globalAlpha = 1;

}


/* =====================================================
   ROCK
===================================================== */

function drawRock(o) {

    ctx.save();


    ctx.translate(
        o.x,
        o.y
    );


    ctx.rotate(
        o.rotation
    );


    ctx.shadowBlur = 20;

    ctx.shadowColor =
        "#ff287f";


    const g =
        ctx.createRadialGradient(
            -o.size * 0.2,
            -o.size * 0.3,
            2,
            0,
            0,
            o.size
        );


    g.addColorStop(
        0,
        "#52637c"
    );

    g.addColorStop(
        0.55,
        "#18283f"
    );

    g.addColorStop(
        1,
        "#070e1e"
    );


    ctx.fillStyle =
        g;


    ctx.beginPath();


    const points = 8;


    for (
        let i = 0;
        i < points;
        i++
    ) {

        const angle =
            i / points *
            Math.PI * 2;


        const radius =
            o.size *
            (
                0.75 +
                Math.random() *
                0.28
            );


        const x =
            Math.cos(angle) *
            radius;

        const y =
            Math.sin(angle) *
            radius;


        if (i === 0) {

            ctx.moveTo(
                x,
                y
            );

        }

        else {

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.closePath();

    ctx.fill();


    ctx.shadowBlur = 0;


    ctx.strokeStyle =
        "rgba(255,60,150,0.7)";

    ctx.lineWidth = 2;

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   MINE
===================================================== */

function drawMine(o) {

    ctx.save();


    ctx.translate(
        o.x,
        o.y
    );


    ctx.rotate(
        o.rotation
    );


    ctx.shadowBlur = 25;

    ctx.shadowColor =
        "#ff225f";


    ctx.fillStyle =
        "#121a2c";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        o.size * 0.72,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.strokeStyle =
        "#ff276d";

    ctx.lineWidth = 2;

    ctx.stroke();


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const a =
            i / 10 *
            Math.PI * 2;


        ctx.beginPath();

        ctx.moveTo(
            Math.cos(a) *
            o.size * 0.5,

            Math.sin(a) *
            o.size * 0.5
        );


        ctx.lineTo(
            Math.cos(a) *
            o.size,

            Math.sin(a) *
            o.size
        );


        ctx.strokeStyle =
            "rgba(255,40,110,0.7)";

        ctx.lineWidth = 3;

        ctx.stroke();

    }


    ctx.shadowBlur = 0;


    ctx.fillStyle =
        "#ff3b78";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   COIN
===================================================== */

function drawCoin(c) {

    const pulse =
        1 +
        Math.sin(
            c.pulse
        ) * 0.08;


    ctx.save();


    ctx.translate(
        c.x,
        c.y
    );


    ctx.scale(
        Math.cos(
            c.rotation
        ),
        1
    );


    ctx.scale(
        pulse,
        pulse
    );


    ctx.shadowBlur = 25;

    ctx.shadowColor =
        "#ffe900";


    const g =
        ctx.createLinearGradient(
            -10,
            -10,
            10,
            10
        );


    g.addColorStop(
        0,
        "#fff58a"
    );

    g.addColorStop(
        0.4,
        "#ffe100"
    );

    g.addColorStop(
        1,
        "#ff9d00"
    );


    ctx.fillStyle =
        g;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        c.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    ctx.strokeStyle =
        "#fff6a0";

    ctx.lineWidth = 2;

    ctx.stroke();


    ctx.fillStyle =
        "rgba(255,255,255,0.65)";


    ctx.font =
        "bold 10px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "$",
        0,
        1
    );


    ctx.restore();

}


/* =====================================================
   BOAT
===================================================== */

function drawBoat() {

    ctx.save();


    ctx.translate(
        boat.x,
        boat.y
    );


    ctx.rotate(
        boat.tilt
    );


    ctx.shadowBlur =
        turbo
        ? 45
        : 25;


    ctx.shadowColor =
        turbo
        ? "#ff3de8"
        : "#00eaff";


    /* Wake */

    ctx.globalAlpha =
        0.5;


    const wake =
        ctx.createLinearGradient(
            0,
            25,
            0,
            100
        );


    wake.addColorStop(
        0,
        "rgba(0,234,255,0.5)"
    );


    wake.addColorStop(
        1,
        "rgba(0,234,255,0)"
    );


    ctx.fillStyle =
        wake;


    ctx.beginPath();

    ctx.moveTo(
        -15,
        25
    );

    ctx.lineTo(
        15,
        25
    );

    ctx.lineTo(
        42,
        105
    );

    ctx.lineTo(
        -42,
        105
    );

    ctx.closePath();

    ctx.fill();


    ctx.globalAlpha = 1;


    /* Turbo */

    if (turbo) {

        const flameSize =
            28 +
            Math.random() *
            15;


        const flame =
            ctx.createLinearGradient(
                0,
                25,
                0,
                75 + flameSize
            );


        flame.addColorStop(
            0,
            "#ffffff"
        );

        flame.addColorStop(
            0.2,
            "#00eaff"
        );

        flame.addColorStop(
            0.6,
            "#8b4dff"
        );

        flame.addColorStop(
            1,
            "rgba(255,0,200,0)"
        );


        ctx.fillStyle =
            flame;


        ctx.beginPath();

        ctx.moveTo(
            -11,
            25
        );


        ctx.quadraticCurveTo(
            -7,
            55 + flameSize,
            0,
            75 + flameSize
        );


        ctx.quadraticCurveTo(
            7,
            55 + flameSize,
            11,
            25
        );


        ctx.closePath();

        ctx.fill();

    }


    /* Hull */

    ctx.shadowBlur =
        turbo
        ? 35
        : 20;


    const hull =
        ctx.createLinearGradient(
            -35,
            -40,
            35,
            50
        );


    hull.addColorStop(
        0,
        "#6df7ff"
    );

    hull.addColorStop(
        0.25,
        "#008fc5"
    );

    hull.addColorStop(
        0.6,
        "#173e73"
    );

    hull.addColorStop(
        1,
        "#07152e"
    );


    ctx.fillStyle =
        hull;


    ctx.beginPath();

    ctx.moveTo(
        0,
        -54
    );

    ctx.lineTo(
        31,
        17
    );


    ctx.quadraticCurveTo(
        25,
        43,
        0,
        52
    );


    ctx.quadraticCurveTo(
        -25,
        43,
        -31,
        17
    );


    ctx.closePath();

    ctx.fill();


    /* Outline */

    ctx.shadowBlur = 0;


    ctx.strokeStyle =
        turbo
        ? "#ff4de8"
        : "#00efff";


    ctx.lineWidth = 2.5;

    ctx.stroke();


    /* Cockpit */

    const cockpit =
        ctx.createLinearGradient(
            -17,
            -35,
            17,
            12
        );


    cockpit.addColorStop(
        0,
        "#baffff"
    );

    cockpit.addColorStop(
        0.18,
        "#21cde4"
    );

    cockpit.addColorStop(
        0.6,
        "#182d5d"
    );

    cockpit.addColorStop(
        1,
        "#080d24"
    );


    ctx.fillStyle =
        cockpit;


    ctx.beginPath();

    ctx.moveTo(
        0,
        -39
    );

    ctx.lineTo(
        17,
        0
    );

    ctx.lineTo(
        0,
        12
    );

    ctx.lineTo(
        -17,
        0
    );

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle =
        "rgba(151,250,255,0.8)";

    ctx.lineWidth = 1.5;

    ctx.stroke();


    /* Center stripe */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -50
    );

    ctx.lineTo(
        0,
        42
    );


    ctx.strokeStyle =
        turbo
        ? "#ff68ef"
        : "#d9ffff";


    ctx.lineWidth = 3;

    ctx.stroke();


    /* Lights */

    ctx.shadowBlur = 15;

    ctx.shadowColor =
        "#00eaff";


    ctx.fillStyle =
        "#00f6ff";


    ctx.beginPath();

    ctx.arc(
        -25,
        17,
        3.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        25,
        17,
        3.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   PARTICLES
===================================================== */

function drawParticles() {

    for (
        const p
        of particles
    ) {

        const alpha =
            Math.max(
                0,
                p.life /
                p.maxLife
            );


        ctx.globalAlpha =
            alpha;


        if (
            p.type ===
            "coin"
        ) {

            ctx.fillStyle =
                "#ffe600";

        }

        else if (
            p.type ===
            "turbo"
        ) {

            ctx.fillStyle =
                "#ff4bed";

        }

        else if (
            p.type ===
            "explosion"
        ) {

            ctx.fillStyle =
                "#ff4eaa";

        }

        else {

            ctx.fillStyle =
                "#54eaff";

        }


        ctx.shadowBlur = 10;

        ctx.shadowColor =
            ctx.fillStyle;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size * alpha,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    ctx.save();


    if (
        shake > 0
    ) {

        ctx.translate(

            (
                Math.random() -
                0.5
            ) * shake,

            (
                Math.random() -
                0.5
            ) * shake

        );

    }


    drawBackground();


    for (
        const o
        of obstacles
    ) {

        if (
            o.type ===
            "rock"
        ) {

            drawRock(o);

        }

        else {

            drawMine(o);

        }

    }


    for (
        const c
        of coinObjects
    ) {

        drawCoin(c);

    }


    drawParticles();

    drawBoat();


    ctx.restore();


    /* Vignette */

    const vignette =
        ctx.createRadialGradient(

            W / 2,
            H / 2,
            H * 0.2,

            W / 2,
            H / 2,
            H * 0.85

        );


    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    vignette.addColorStop(
        1,
        "rgba(0,0,20,0.45)"
    );


    ctx.fillStyle =
        vignette;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(now) {

    const dt =
        Math.min(
            0.035,
            (now - lastTime) /
            1000 || 0
        );


    lastTime = now;


    if (running) {

        update(dt);

    }

    else {

        gameTime += dt;

    }


    render();


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);


/* =====================================================
   MOBILE SAFETY
===================================================== */

document.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

    },
    {
        passive: false
    }
);

</script>
